name: verify

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer stale, so it is
# cancelled rather than left to finish and report on code nobody has any more.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      # Both ends of what package.json claims to support. The lower one is the
      # promise; without running it, `engines: node >=22` is a guess.
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run verify
