name: verify

on:
  push:
    branches: [main]
  pull_request:

# A superseded pull request run reports on code nobody has any more, so it is
# cancelled. Pushes to main are not: two merges landing back to back would
# leave the first commit with no completed answer, which is the one place the
# history is expected to be green.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      # Both ends of what package.json claims to support. The lower one is the
      # promise; without running it, `engines: node >=22` is a guess.
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Keyed on the whole lockfile — a playwright bump must bust it, and any
      # other dependency bump busts it too (~115 MB re-download; acceptable,
      # a stale browser build would be worse). Deliberately Node-agnostic:
      # both matrix legs want the same chromium, a concurrent save conflict
      # degrades gracefully.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # The e2e verify step drives a real browser through the review loop.
      # On a cache hit this skips the download; the --with-deps apt step
      # still runs every time.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run verify

  # The four criteria the whole project stands on — custom properties stay
  # writable, media queries respond, identifiers resolve in a browser, the
  # copy is inert — need a real browser and a real serialiser run. A separate
  # job, so the main verify matrix is not slowed down; on every PR, because a
  # serialiser regression is cheapest to catch before it merges. One Node
  # version: the suite exercises the browser and the serialiser, not Node.
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same key as the verify job on purpose — one browser cache per commit.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run test:capture
