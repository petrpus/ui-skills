<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Kontrolní vzorek pro spike</title>
<style>
  :root {
    --brand: #2563eb;
    --surface: #ffffff;
    --ink: #18181b;
    --gap: 16px;
    /* Channel-based colour, the way several design systems now compose them.
       A probe that only recognises a token painted verbatim as a colour cannot
       see this one — which is exactly how one such probe reported a live system
       as having no live tokens at all. */
    --accent-channel: 220 38 38;
  }

  body { background: var(--surface); color: var(--ink); font-family: system-ui, sans-serif; margin: 0; }
  .wrap { padding: var(--gap); max-width: 60rem; margin: 0 auto; }
  .banner { background: var(--brand); color: #fff; padding: var(--gap); border-radius: 8px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); margin-top: var(--gap); }
  .card { border: 1px solid #e4e4e7; border-radius: 8px; padding: var(--gap); }
  .note { color: var(--brand); }
  .channelled { color: rgb(var(--accent-channel) / 90%); }

  /* Whether these still respond after serialisation is criterion (b). */
  @media (max-width: 600px) {
    .cards { grid-template-columns: 1fr; }
    .banner { background: #dc2626; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="banner" id="banner">
    <h1>Kontrolní vzorek</h1>
    <p class="note" id="note">Tenhle odstavec bere barvu z custom property.</p>
    <p class="channelled" id="channelled">Tenhle ji skládá z kanálů.</p>
  </header>

  <section class="cards" id="cards">
    <article class="card"><h2>První</h2><p>Text karty jedna.</p></article>
    <article class="card"><h2>Druhá</h2><p>Text karty dvě.</p></article>
    <article class="card"><h2>Třetí</h2><p>Text karty tři.</p></article>
  </section>

  <div id="host"></div>
  <div id="closed-host"></div>

  <!-- Inline SVG, including a camelCase name and a foreign-namespace subtree:
       xpath resolves differently here, and without this the regression test
       cannot see whether it resolves at all. -->
  <svg id="znak" width="80" height="40" viewBox="0 0 80 40" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="prechod"><stop offset="0" stop-color="#2563eb"/></linearGradient>
    </defs>
    <rect x="0" y="0" width="80" height="40" fill="url(#prechod)"/>
    <foreignObject x="8" y="8" width="64" height="24">
      <p xmlns="http://www.w3.org/1999/xhtml">HTML uvnitř SVG</p>
    </foreignObject>
  </svg>

  <p id="written-by-script">Tenhle text má přepsat skript.</p>

  <!-- Spouštěcí cesty bez jediného <script>. Zachycení je má zneškodnit;
       prohlížečová sada pak kontroluje, že v kopii nezůstaly. -->
  <p id="pasti">
    <a id="past-href" href="javascript:steal()">odkaz</a>
    <a id="past-ping" href="/ok" ping="javascript:steal()">odkaz s ping</a>
    <iframe id="past-ram" srcdoc="&lt;script&gt;parent.postMessage('pwned','*')&lt;/script&gt;"></iframe>
  </p>
</div>

<script>
  // Two shadow roots, one of each mode. A closed one answers `host.shadowRoot`
  // with null to anyone outside it, so identifiers pointing into it would never
  // resolve unless the capture opens it.
  const closedHost = document.getElementById("closed-host");
  const closedShadow = closedHost.attachShadow({ mode: "closed" });
  closedShadow.innerHTML = '<p class="inner" id="closed-text">Odstavec v zavřeném stromu.</p>';

  // Shadow DOM with its own stylesheet: does the serialiser carry it across?
  const host = document.getElementById("host");
  const shadow = host.attachShadow({ mode: "open" });
  shadow.innerHTML =
    '<style>.inner { color: var(--brand); padding: 8px; }</style>' +
    '<p class="inner" id="shadow-text">Odstavec ve stínovém stromu.</p>';

  // A style injected at runtime, the way CSS-in-JS libraries do it.
  const injected = document.createElement("style");
  injected.textContent = ".card h2 { letter-spacing: 0.02em; color: var(--brand); }";
  document.head.append(injected);

  // Proof the page ran: if the snapshot still says "má přepsat", the script
  // never ran there — which for criterion (d) is the wanted answer.
  document.getElementById("written-by-script").textContent =
    "Tenhle text přepsal skript při načtení.";

  // Something that would keep running if scripts survived serialisation.
  let ticks = 0;
  setInterval(() => {
    ticks += 1;
    document.title = `Kontrolní vzorek pro spike (${ticks})`;
  }, 200);
</script>
</body>
</html>
